name: EAS Update (OTA)

on:
  push:
    branches:
      - main
      - develop

jobs:
  update:
    name: EAS Update (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update (main → production)
        if: github.ref_name == 'main'
        run: eas update --channel production --message "${{ github.event.head_commit.message }}" --non-interactive

      - name: Publish OTA update (develop → staging)
        if: github.ref_name == 'develop'
        run: eas update --channel staging --message "${{ github.event.head_commit.message }}" --non-interactive
